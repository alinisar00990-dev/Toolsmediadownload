    <script>
        // Header menu
        document.getElementById('mobileMenuBtn').addEventListener('click', function (e) {
            e.stopPropagation(); this.classList.toggle('active'); document.getElementById('navLinks').classList.toggle('active');
        });
        document.addEventListener('click', function (e) {
            const nav = document.getElementById('navLinks');
            const btn = document.getElementById('mobileMenuBtn');
            if (nav.classList.contains('active') && !nav.contains(e.target) && !btn.contains(e.target)) {
                nav.classList.remove('active'); btn.classList.remove('active');
            }
        });

        // ============ RAPIDAPI CONFIG ============
        const RAPID_API_KEY  = "b4ae13065cmsh2871fc755a3c59dp1346eejsn2d5a9c6dd1ce";
        const RAPID_API_HOST = "instagram-downloader-download-instagram-videos-stories1.p.rapidapi.com";
        const RAPID_API_BASE = "https://instagram-downloader-download-instagram-videos-stories1.p.rapidapi.com/fetch";

        const form       = document.getElementById("downloadForm");
        const input      = document.getElementById("instaUrl");
        const statusEl   = document.getElementById("statusMsg");
        const resultArea = document.getElementById("resultArea");
        const mediaGrid  = document.getElementById("mediaGrid");
        const btn        = document.getElementById("fetchBtn");

        function isValidInstagramUrl(value) {
            try {
                const url = new URL(value);
                const allowed = ["instagram.com", "www.instagram.com"];
                return url.protocol === "https:" && allowed.includes(url.hostname.toLowerCase());
            } catch {
                return false;
            }
        }

        function showStatus(msg) {
            statusEl.textContent = msg;
        }

        function clearResults() {
            mediaGrid.replaceChildren();
            resultArea.style.display = "none";
        }

        function addMediaCard(mediaUrl, type, labelText) {
            const card = document.createElement("div");
            card.className = "media-card";

            let mediaEl;
            if (type === "video") {
                mediaEl = document.createElement("video");
                mediaEl.controls = true;
                mediaEl.preload = "metadata";
                mediaEl.src = mediaUrl;
            } else {
                mediaEl = document.createElement("img");
                mediaEl.src = mediaUrl;
            }

            const info = document.createElement("div");
            info.className = "media-info";

            const label = document.createElement("p");
            label.textContent = labelText || (type === "video" ? "Video ready" : "Photo ready");

            const dl = document.createElement("a");
            dl.className = "dl-btn";
            dl.href = mediaUrl;
            dl.target = "_blank";
            dl.rel = "noopener noreferrer";
            dl.download = type === "video" ? "instagram_video.mp4" : "instagram_photo.jpg";
            dl.textContent = type === "video" ? "⚡ Download Video" : "⚡ Download Photo";

            info.append(label, dl);
            card.append(mediaEl, info);
            mediaGrid.appendChild(card);
            resultArea.style.display = "block";
        }

        // Smart Universal Parser for RapidAPI
        function extractUrlsFromResponse(data) {
            let extracted = [];

            if (!data) return extracted;

            // 1. Check direct string
            if (typeof data === "string" && data.startsWith("http")) {
                return [{ url: data, type: data.includes(".mp4") ? "video" : "image" }];
            }

            // 2. Check standard object properties
            if (data.media) {
                if (typeof data.media === "string") {
                    extracted.push({ url: data.media, type: (data.Type || "").toLowerCase().includes("video") || data.media.includes(".mp4") ? "video" : "image" });
                } else if (Array.isArray(data.media)) {
                    data.media.forEach(m => {
                        if (typeof m === "string") extracted.push({ url: m, type: m.includes(".mp4") ? "video" : "image" });
                        else if (m.url) extracted.push({ url: m.url, type: m.type || "video" });
                    });
                }
            }

            if (data.url && typeof data.url === "string") {
                extracted.push({ url: data.url, type: data.url.includes(".mp4") ? "video" : "image" });
            }

            if (data.download_url && typeof data.download_url === "string") {
                extracted.push({ url: data.download_url, type: "video" });
            }

            // 3. Fallback: Deep search using Regex inside JSON string
            if (extracted.length === 0) {
                const jsonStr = JSON.stringify(data);
                const urlMatches = jsonStr.match(/https?:\/\/[^"]+/g) || [];
                urlMatches.forEach(u => {
                    if (u.includes("cdninstagram.com") || u.includes("fbcdn.net") || u.includes(".mp4") || u.includes(".jpg")) {
                        // Clean clean escaped slashes
                        const cleanUrl = u.replace(/\\/g, '');
                        extracted.push({ url: cleanUrl, type: cleanUrl.includes(".mp4") ? "video" : "image" });
                    }
                });
            }

            // Filter unique links
            const unique = [];
            const seen = new Set();
            extracted.forEach(item => {
                if (!seen.has(item.url)) {
                    seen.add(item.url);
                    unique.push(item);
                }
            });

            return unique;
        }

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const url = input.value.trim();
            clearResults();

            if (!isValidInstagramUrl(url)) {
                showStatus("❌ Please enter a valid Instagram Reel, Post, or Story link.");
                input.focus();
                return;
            }

            btn.disabled = true;
            btn.textContent = "Please wait...";
            showStatus("⏳ Fetching media from server. Please wait...");

            try {
                const apiUrl = RAPID_API_BASE + "?url=" + encodeURIComponent(url);

                const response = await fetch(apiUrl, {
                    method: "GET",
                    headers: {
                        "x-rapidapi-key": RAPID_API_KEY,
                        "x-rapidapi-host": RAPID_API_HOST
                    }
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}. Please check your RapidAPI plan or key.`);
                }

                const data = await response.json();
                console.log("RapidAPI Response:", data); // Debugging info

                const mediaList = extractUrlsFromResponse(data);

                if (!mediaList.length) {
                    throw new Error("Could not find downloadable media in this link. It may be from a private account.");
                }

                mediaList.forEach((m, idx) => {
                    addMediaCard(m.url, m.type, mediaList.length > 1 ? `Media Item ${idx + 1}` : "Your file is ready.");
                });

                showStatus("✓ Download link generated successfully!");

            } catch (err) {
                console.error("Downloader Error:", err);
                showStatus("❌ " + (err.message || "Failed to process request. Please try again."));
            } finally {
                btn.disabled = false;
                btn.textContent = "Download";
            }
        });
    </script>
