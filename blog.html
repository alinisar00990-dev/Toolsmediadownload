    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg-dark: #0a0510; --accent: #FFB39A; --accent-glow: #ff8a66; --text-light: #f0e6ef; --text-dim: #a08ca0; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg-dark); color: var(--text-light); line-height: 1.6; }
        
        /* Navbar & Mobile Menu */
        .navbar {
            position: sticky; top: 0; background: rgba(10,5,16,0.85); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,179,154,0.15); padding: 18px 5%;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        .nav-logo {
            font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: clamp(16px, 3vw, 20px);
            background: linear-gradient(135deg, var(--accent), var(--accent-glow));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-decoration: none; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;
        }
        .nav-logo span { font-size: 24px; }
        
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-size: 14.5px; font-weight: 500; position: relative; transition: color 0.3s; }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--accent); transition: width 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        .nav-links a:hover::after { width: 100%; }

        /* Hamburger Button */
        .menu-toggle { display: none; cursor: pointer; color: var(--text-light); }
        .menu-toggle svg { width: 28px; height: 28px; stroke: currentColor; stroke-width: 2; fill: none; }

        .container { max-width: 1100px; margin: 60px auto; padding: 0 20px; }
        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 38px; color: var(--accent); margin-bottom: 10px; }
        .header p { color: var(--text-dim); font-size: 16px; }

        .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .blog-card { background: linear-gradient(135deg, rgba(84,36,82,0.4), rgba(26,13,26,0.4)); border: 1px solid rgba(255,179,154,0.15); border-radius: 20px; padding: 25px; transition: 0.3s; }
        .blog-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .blog-tag { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 10px; display: block; }
        .blog-card h2 { font-size: 20px; color: white; margin-bottom: 12px; font-family: 'Orbitron', sans-serif; }
        .blog-card p { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
        .read-btn { display: inline-block; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
        .read-btn:hover { text-decoration: underline; }

        footer { border-top: 1px solid rgba(255,179,154,0.1); padding: 30px 20px; text-align: center; color: var(--text-dim); font-size: 13px; margin-top: 80px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(10,5,16,0.95);
                backdrop-filter: blur(20px);
                border-bottom: 1px solid rgba(255,179,154,0.2);
                padding: 20px 0;
                gap: 20px;
                text-align: center;
            }
