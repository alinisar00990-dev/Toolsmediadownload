<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ToolsMediaDownloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg-dark: #0a0510; --accent: #FFB39A; --accent-glow: #ff8a66; --text-light: #f0e6ef; --text-dim: #a08ca0; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg-dark); color: var(--text-light); }
        
        /* Navbar */
        .navbar { position: sticky; top: 0; background: rgba(10,5,16,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,179,154,0.15); padding: 18px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .nav-logo { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-glow)); -webkit-background-clip: text; color: transparent; text-decoration: none; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-size: 14px; margin-left: 20px; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }

        /* Contact Section */
        .page-header { text-align: center; padding: 80px 20px 40px; }
        .page-header h1 { font-family: 'Orbitron', sans-serif; font-size: 40px; color: var(--accent); margin-bottom: 15px; }
        .page-header p { color: var(--text-dim); max-width: 600px; margin: auto; line-height: 1.6; }

        .contact-container { max-width: 800px; margin: 0 auto 80px; padding: 0 20px; }
        .glass-box { background: linear-gradient(135deg, rgba(84,36,82,0.4), rgba(26,13,26,0.4)); backdrop-filter: blur(20px); border: 1px solid rgba(255,179,154,0.15); border-radius: 20px; padding: 40px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,179,154,0.2); border-radius: 10px; color: white; font-family: inherit; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); background: rgba(255,179,154,0.05); }
        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-glow)); color: var(--bg-dark); border: none; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,179,154,0.3); }

        .direct-email { text-align: center; margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(255,179,154,0.1); }
        .direct-email a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 18px; }

        footer { border-top: 1px solid rgba(255,179,154,0.1); padding: 30px 20px; text-align: center; color: var(--text-dim); font-size: 13px; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="nav-logo">⚡ ToolsMediaDownloader</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy</a>
    </div>
</nav>

<div class="page-header">
    <h1>Contact Us</h1>
    <p>Have a question, suggestion, or facing an issue? Fill out the form below or send us a direct email. We are always here to help!</p>
</div>

<div class="contact-container">
    <div class="glass-box">
        <!-- Notice: You can link this form to free services like Formspree.io later -->
        <form onsubmit="event.preventDefault(); alert('Message sent successfully! We will get back to you soon.');">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>

        <div class="direct-email">
            <p style="color: var(--text-dim); margin-bottom: 5px;">Or email us directly at:</p>
            <a href="mailto:m.aliarain070@gmail.com">m.aliarain070@gmail.com</a>
        </div>
    </div>
</div>

<footer>© 2026 ToolsMediaDownloader · All rights reserved.</footer>

</body>
</html>
