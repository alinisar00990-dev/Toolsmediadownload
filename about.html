    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg-dark: #0a0510; --accent: #FFB39A; --accent-glow: #ff8a66; --purple: #542452; --text-light: #f0e6ef; --text-dim: #a08ca0; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* Orbs Background */
        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.3; z-index: -1; pointer-events: none; }
        .orb-1 { width: 400px; height: 400px; background: #542452; top: -100px; left: -100px; animation: float1 15s infinite ease-in-out; }
        .orb-2 { width: 350px; height: 350px; background: #ff8a66; bottom: -100px; right: -100px; animation: float2 18s infinite ease-in-out; }
        @keyframes float1 { 50% { transform: translate(100px, 150px); } } @keyframes float2 { 50% { transform: translate(-80px, -120px); } }

        /* Navbar */
        .navbar { position: sticky; top: 0; background: rgba(10,5,16,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,179,154,0.15); padding: 18px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .nav-logo { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 20px; background: linear-gradient(135deg, var(--accent), var(--accent-glow)); -webkit-background-clip: text; color: transparent; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }

        /* Hero */
        .hero { text-align: center; padding: 100px 20px 60px; animation: fadeInUp 0.8s ease; }
        .hero h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(32px, 5vw, 54px); margin-bottom: 20px; }
        .hero h1 span { background: linear-gradient(135deg, var(--accent), var(--accent-glow)); -webkit-background-clip: text; color: transparent; }
        .hero p { color: var(--text-dim); max-width: 650px; margin: auto; font-size: 17px; line-height: 1.7; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Content Container */
        .container { max-width: 1000px; margin: auto; padding: 20px 5% 100px; flex: 1; }

        .about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-top: 40px; }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(84,36,82,0.4), rgba(26,13,26,0.4));
            backdrop-filter: blur(20px); border: 1px solid rgba(255,179,154,0.15);
            border-radius: 20px; padding: 35px; transition: 0.3s;
        }
        .glass-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 15px 40px rgba(255,179,154,0.15); }
        .card-icon { font-size: 40px; margin-bottom: 15px; }
        .glass-card h3 { font-family: 'Orbitron', sans-serif; font-size: 20px; margin-bottom: 10px; color: var(--accent); }
        .glass-card p { color: var(--text-dim); font-size: 14.5px; line-height: 1.6; }

        /* Footer */
        footer { background: linear-gradient(180deg, transparent, rgba(10,5,16,0.9)); border-top: 1px solid rgba(255,179,154,0.1); padding: 50px 20px 30px; text-align: center; }
        .footer-brand { font-family: 'Orbitron', sans-serif; font-size: 22px; color: var(--accent); margin-bottom: 15px; }
        .footer-links { display: flex; justify-content: center; gap: 25px; margin: 20px 0; }
        .footer-links a { color: var(--text-dim); text-decoration: none; font-size: 14px; transition: 0.3s; }
        .footer-links a:hover { color: var(--accent); }
        .footer-copy { color: var(--text-dim); font-size: 12px; margin-top: 20px; }
    </style>
</head>
