<!-- Load libraries: local first, then CDNs. omggif exposes global GifReader (not window.omggif). -->
<script>
  window.__gifLibsReady = (async function () {
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.async = true;
        s.onload = () => resolve(url);
        s.onerror = () => {
          s.remove();
          reject(new Error('Could not load ' + url));
        };
        document.head.appendChild(s);
      });
    }

    function getOmggifApi() {
      if (typeof window.GifReader === 'function') {
        return {
          GifReader: window.GifReader,
          GifWriter: window.GifWriter
        };
      }
      const lib = window.omggif || window.Omggif || window.OMGGIF;
      if (lib && typeof lib.GifReader === 'function') return lib;
      return null;
    }

    function hasGifJs() {
      return typeof window.GIF === 'function';
    }

    async function loadAny(urls, test, label) {
      let lastError;
      for (const url of urls) {
        try {
          await loadScript(url);
          if (test()) return url;
          throw new Error(label + ' loaded but did not expose its expected API from ' + url);
        } catch (e) {
          lastError = e;
        }
      }
      throw new Error(
        'Could not load the ' + label +
        ' library. Tried local files and CDNs. ' +
        'Your network, browser extension, firewall, or Content Security Policy ' +
        'may be blocking scripts. Last error: ' +
        (lastError && lastError.message || 'unknown error')
      );
    }

    const omggifUrl = await loadAny([
      './omggif.js',
      './lib/omggif.js',
      'https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js',
      'https://unpkg.com/omggif@1.0.10/omggif.js',
      'https://cdn.jsdelivr.net/gh/deanm/omggif@1.0.10/omggif.js'
    ], () => !!getOmggifApi(), 'Omggif');

    window.__omggif = getOmggifApi();

    const gifUrl = await loadAny([
      './gif.js',
      './lib/gif.js',
      'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js',
      'https://unpkg.com/gif.js@0.2.0/dist/gif.js',
      'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js',
      'https://cdn.jsdelivr.net/gh/jnordberg/gif.js@0.2.0/dist/gif.js'
    ], hasGifJs, 'gif.js');

    window.__gifWorkerUrls = [
      './gif.worker.js',
      './lib/gif.worker.js',
      'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js',
      'https://unpkg.com/gif.js@0.2.0/dist/gif.worker.js',
      'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js',
      'https://cdn.jsdelivr.net/gh/jnordberg/gif.js@0.2.0/dist/gif.worker.js'
    ];

    return { omggifUrl, gifUrl };
  })();
</script>
