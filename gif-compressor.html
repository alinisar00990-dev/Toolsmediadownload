<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIF Compressor - Fast Animated GIF Compression | ToolsMediaDownload</title>
    
    <!-- Round Peach Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg">
    <meta name="theme-color" content="#E07A5F">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Standalone Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

    <style>
        :root {
            --bg-warm: #FAF5EE;
            --card-bg: #FFFFFF;
            --primary-peach: #E07A5F;
            --peach-hover: #D95D39;
            --peach-light: #FDE8E1;
            --peach-gradient: linear-gradient(135deg, #FF9E7D 0%, #E07A5F 50%, #D95D39 100%);
            --text-dark: #2C221E;
            --text-muted: #706661;
            --border-warm: #EFE3D8;
            --dark-footer: #1A1615;
            --shadow-soft: 0 10px 30px rgba(224, 122, 95, 0.08);
            --radius-main: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-warm); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

        /* HEADER */
        header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-warm); position: sticky; top: 0; z-index: 1000; }
        .navbar { max-width: 1200px; margin: 0 auto; padding: 0.8rem 1.25rem; display: flex; align-items: center; justify-content: space-between; }
        
        .logo { 
            font-family: 'Space Grotesk', sans-serif; 
            font-size: clamp(1.1rem, 4.5vw, 1.6rem); 
            font-weight: 700; 
            color: var(--text-dark); 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 0.4rem;
        }
        .logo-icon { color: #FF9E7D; }
        .logo span { background: var(--peach-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 600; font-size: 0.9rem; }

        /* MAIN CONTENT */
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1.25rem; flex: 1; }
        .header-box { text-align: center; margin-bottom: 2rem; }
        .header-box h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.8rem, 6vw, 2.5rem); margin-bottom: 0.5rem; }
        .header-box h1 span { color: var(--primary-peach); }

        .card { background: var(--card-bg); border: 1px solid var(--border-warm); border-radius: var(--radius-main); padding: 2rem; box-shadow: var(--shadow-soft); text-align: center; }
        
        /* DROP ZONE */
        .drop-zone { border: 2px dashed var(--primary-peach); border-radius: 14px; padding: 2.5rem 1rem; background: var(--peach-light); cursor: pointer; transition: 0.2s; }
        .drop-zone i { font-size: 3rem; color: var(--primary-peach); margin-bottom: 1rem; }
        .drop-zone h3 { font-size: 1.2rem; margin-bottom: 0.4rem; }
        #fileInput { display: none; }

        /* PREVIEW AREA */
        .preview-box { display: none; margin-top: 1.5rem; border: 1px solid var(--border-warm); border-radius: 12px; padding: 1rem; text-align: left; background: #FAFAFA; }
        .preview-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .preview-header img { width: 80px; height: 80px; object-fit: contain; border-radius: 8px; background: #000; }
        .file-meta b { display: block; font-size: 0.95rem; word-break: break-all; }
        .file-meta span { font-size: 0.8rem; color: var(--text-muted); }

        /* CONTROLS */
        .controls { display: none; margin-top: 1.5rem; }
        .grid-settings { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; text-align: left; margin-bottom: 1.5rem; }
        .setting-item label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.5rem; }
        .range { width: 100%; accent-color: var(--primary-peach); cursor: pointer; }

        .btn-main { width: 100%; background: var(--peach-gradient); color: #FFF; border: none; padding: 1rem; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px var(--glow-peach); display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }

        /* PROGRESS */
        .progress-area { display: none; margin-top: 1.5rem; }
        .bar-container { width: 100%; height: 10px; background: var(--bg-warm); border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .bar-fill { width: 0%; height: 100%; background: var(--peach-gradient); transition: 0.3s; }

        .error-msg { display: none; background: #FCE8E6; color: #C5221F; padding: 1rem; border-radius: 10px; margin-top: 1.5rem; font-weight: 600; font-size: 0.9rem; }

        /* RESULT */
        .result-area { display: none; margin-top: 2rem; border-top: 2px solid var(--border-warm); pt: 2rem; }
        .result-img { max-width: 100%; border-radius: 12px; margin-bottom: 1.5rem; box-shadow: var(--shadow-soft); }
        .stats { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1.5rem; }
        .stat-item { background: var(--bg-warm); padding: 0.5rem 1rem; border-radius: 8px; }
        .stat-item small { display: block; font-size: 0.7rem; color: #777; }

        @media (max-width: 600px) {
            .grid-settings { grid-template-columns: 1fr; }
            .nav-links { display: none; }
            .card { padding: 1.25rem; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <span class="logo-icon">⚡</span> ToolsMedia<span>Download</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="header-box">
            <h1>GIF <span>Compressor</span></h1>
            <p>High-quality animated GIF reduction for mobile and desktop.</p>
        </div>

        <div class="card">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()" id="dropZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>Select Animated GIF</h3>
                <p>Click to browse or drag file here</p>
                <input type="file" id="fileInput" accept="image/gif">
            </div>

            <div class="preview-box" id="previewBox">
                <div class="preview-header">
                    <img id="thumbPreview" src="" alt="">
                    <div class="file-meta">
                        <b id="fileNameText">animation.gif</b>
                        <span id="fileSizeText">0 KB</span>
                    </div>
                </div>
            </div>

            <div class="controls" id="controls">
                <div class="grid-settings">
                    <div class="setting-item">
                        <label>Compression: <span id="qLabel">60%</span></label>
                        <input type="range" id="qRange" class="range" min="10" max="90" value="60" oninput="document.getElementById('qLabel').innerText=this.value+'%'">
                    </div>
                    <div class="setting-item">
                        <label>Resize: <span id="sLabel">100%</span></label>
                        <input type="range" id="sRange" class="range" min="20" max="100" value="100" oninput="document.getElementById('sLabel').innerText=this.value+'%'">
                    </div>
                </div>
                <button class="btn-main" id="btnGo" onclick="processGif()">
                    <i class="fas fa-compress-arrows-alt"></i> Compress GIF
                </button>
            </div>

            <div id="errorMsg" class="error-msg"></div>

            <div class="progress-area" id="progressArea">
                <h4 id="statusText">Processing...</h4>
                <div class="bar-container">
                    <div class="bar-fill" id="barFill"></div>
                </div>
            </div>

            <div class="result-area" id="resultArea">
                <h3>Compression Ready!</h3>
                <img src="" id="finalGif" class="result-img">
                <div class="stats">
                    <div class="stat-item"><small>New Size</small><strong id="newSize">0 KB</strong></div>
                    <div class="stat-card stat-item"><small>Saved</small><strong id="savePercent" style="color:green">0%</strong></div>
                </div>
                <a id="dlLink" href="#" download="compressed.gif" class="btn-main" style="max-width:300px; margin: 0 auto; text-decoration:none;">
                    <i class="fas fa-download"></i> Download GIF
                </a>
            </div>
        </div>
    </main>

    <script>
        let gifData = null;
        let originalFile = null;
        let workerBlobUrl = null;

        // INLINE WORKER to prevent all CORS / Loading issues
        async function setupWorker() {
            try {
                const res = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
                const js = await res.text();
                workerBlobUrl = URL.createObjectURL(new Blob([js], {type: 'application/javascript'}));
            } catch(e) { console.error("Worker failed to init"); }
        }
        setupWorker();

        const fileInput = document.getElementById('fileInput');
        fileInput.onchange = (e) => {
            if(e.target.files.length) handleFile(e.target.files[0]);
        };

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' Bytes';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            else return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function handleFile(file) {
            if(!file.type.includes('gif')) return alert("Select a GIF file");
            
            originalFile = file;
            document.getElementById('fileNameText').innerText = file.name;
            document.getElementById('fileSizeText').innerText = formatSize(file.size);
            document.getElementById('thumbPreview').src = URL.createObjectURL(file);
            document.getElementById('previewBox').style.display = 'block';
            document.getElementById('controls').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('resultArea').style.display = 'none';

            const reader = new FileReader();
            reader.onload = (ev) => {
                let buf = new Uint8Array(ev.target.result);
                // Robust Scan for GIF Header (Handles Mobile Metadata)
                let start = -1;
                for(let i=0; i<Math.min(buf.length, 3000); i++) {
                    if(buf[i]===0x47 && buf[i+1]===0x49 && buf[i+2]===0x46) {
                        start = i; break;
                    }
                }
                gifData = start === -1 ? buf : buf.subarray(start);
            };
            reader.readAsArrayBuffer(file);
        }

        async function processGif() {
            if(!gifData) return;

            const btn = document.getElementById('btnGo');
            const progress = document.getElementById('progressArea');
            const bar = document.getElementById('barFill');
            const status = document.getElementById('statusText');
            const err = document.getElementById('errorMsg');

            btn.disabled = true;
            err.style.display = 'none';
            progress.style.display = 'block';
            bar.style.width = '10%';

            try {
                const reader = new Omggif.GifReader(gifData);
                const n = reader.numFrames();
                const scale = document.getElementById('sRange').value / 100;
                const w = Math.round(reader.width * scale);
                const h = Math.round(reader.height * scale);
                const quality = Math.max(1, Math.min(30, Math.round((100 - document.getElementById('qRange').value)/3)));

                const gif = new GIF({
                    workers: 2,
                    quality: quality,
                    width: w,
                    height: h,
                    workerScript: workerBlobUrl || 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
                });

                const c = document.createElement('canvas');
                c.width = reader.width; c.height = reader.height;
                const ctx = c.getContext('2d');

                const c2 = document.createElement('canvas');
                c2.width = w; c2.height = h;
                const ctx2 = c2.getContext('2d');

                status.innerText = `Extracting ${n} frames...`;
                for(let i=0; i<n; i++) {
                    const info = reader.frameInfo(i);
                    const imgData = ctx.createImageData(reader.width, reader.height);
                    reader.decodeAndBlitFrameRGBA(i, imgData.data);
                    ctx.putImageData(imgData, 0, 0);
                    
                    ctx2.clearRect(0,0,w,h);
                    ctx2.drawImage(c, 0, 0, w, h);
                    gif.addFrame(ctx2, {delay: info.delay * 10, copy: true});
                    bar.style.width = (10 + (i/n)*50) + '%';
                }

                status.innerText = "Encoding animation...";
                gif.on('progress', p => { bar.style.width = (60 + p*35) + '%'; });
                
                gif.on('finished', blob => {
                    bar.style.width = '100%';
                    const url = URL.createObjectURL(blob);
                    document.getElementById('finalGif').src = url;
                    document.getElementById('dlLink').href = url;
                    document.getElementById('newSize').innerText = formatSize(blob.size);
                    const saved = Math.max(0, Math.round((1 - blob.size/originalFile.size)*100));
                    document.getElementById('savePercent').innerText = saved + '%';
                    
                    progress.style.display = 'none';
                    document.getElementById('resultArea').style.display = 'block';
                    document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
                    btn.disabled = false;
                });

                gif.render();

            } catch(e) {
                console.error(e);
                btn.disabled = false;
                progress.style.display = 'none';
                err.innerText = "Error: This GIF file structure is not supported or corrupted.";
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
